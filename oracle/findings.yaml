# Review labels for MISSED and PARTIAL results, written after the run that found them.
# Labels: documented_behavior, possible_bug, oracle_disputed, not_reviewed.
# Each entry: {case, tool, label, note}. A result with no entry is not_reviewed.
findings:
  - case: C1
    tool: pdfsig
    label: documented_behavior
    note: &pdfsig_note >-
      Reports "Not total document signed" and a valid signature. Its output has no field
      that classifies a later change, so it reports coverage without judging it.
  - {case: C2, tool: pdfsig, label: documented_behavior, note: *pdfsig_note}
  - {case: C3, tool: pdfsig, label: documented_behavior, note: *pdfsig_note}
  - {case: C4, tool: pdfsig, label: documented_behavior, note: *pdfsig_note}
  - {case: C5, tool: pdfsig, label: documented_behavior, note: *pdfsig_note}
  - case: C2
    tool: dss
    label: documented_behavior
    note: >-
      The object changes are all SignatureOrFormFill. The filled value also gives a
      visual difference warning, documented at WARN in the default policy. The mapping
      counts that as an other warning, which is why this is not an allowed change.
  - case: C3
    tool: dss
    label: documented_behavior
    note: >-
      TOTAL_PASSED with a DocMDP warning. The default policy documents DocMDP at WARN, so
      it reports the violation and does not fail the signature. A stricter policy could.
  - case: C4
    tool: dss
    label: documented_behavior
    note: &dss_changed_note >-
      TOTAL_PASSED with visual difference and undefined change warnings. The default
      policy documents both at WARN, so it reports the change and leaves the decision to
      the reader.
  - {case: C5, tool: dss, label: documented_behavior, note: *dss_changed_note}
  - case: A3
    tool: pdfsig
    label: documented_behavior
    note: >-
      Reports "Not total document signed" and a valid signature, which is accurate for a
      gap wider than /Contents. It does not say the signature structure is nonstandard.
  - case: B5
    tool: pyhanko
    label: documented_behavior
    note: >-
      ValidationContext defaults to revocation_mode soft-fail, so an unreachable source
      does not change the result. The kit keeps that default. This is the API default,
      and the CLI has its own revocation options, which were not run.
  - case: E2
    tool: pdfsig
    label: documented_behavior
    note: >-
      Its output has no field for a signature timestamp, so an untrusted timestamp cannot
      change the result.
  - case: E2
    tool: dss
    label: oracle_disputed
    note: >-
      TOTAL_PASSED, and the timestamp is reported separately as INDETERMINATE,
      NO_CERTIFICATE_CHAIN_FOUND. DSS does not use it as proof of time, and the signature
      stands at the validation time. The oracle's policy says offered but unproven evidence
      is insufficient. The expected value is unchanged, and this is for the owner to decide.
